spring.application.name=clinicare-back

spring.datasource.url=jdbc:postgresql://localhost:5432/clinicare
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
# Keep request- and data-related details out of logs by default. Enable only
# temporarily in a local development environment when troubleshooting.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# A signing key must always be supplied by the deployment environment. Never
# ship a fallback key: anyone who knows it could forge authentication tokens.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------------------------------------------------------------------------
# Mail (Spring Mail + Gmail SMTP)
# Credentials are supplied through environment variables (see .env / .env.example)
# and are never hardcoded. MAIL_USERNAME is the sending Gmail address and
# MAIL_PASSWORD is a Gmail App Password (not the normal account password).
# ---------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Display name shown to recipients, e.g. "CliniCare Support <clinicare.app.support@gmail.com>".
clinicare.mail.from-name=CliniCare Support

# ---------------------------------------------------------------------------
# Email verification
#   clinicare.app.base-url : public base URL used to build the verification
#       link emailed to new accounts. Point this at the backend in dev, or at
#       the Angular frontend (which then calls the API) in production.
#   clinicare.email-verification.token-expiration-minutes : how long a
#       verification link stays valid (default 24 hours).
# ---------------------------------------------------------------------------
clinicare.app.base-url=${APP_BASE_URL:http://localhost:8080}
clinicare.email-verification.token-expiration-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MINUTES:1440}
