spring.application.name=clinicare-back

spring.datasource.url=jdbc:postgresql://localhost:5432/clinicare
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
# Keep request- and data-related details out of logs by default. Enable only
# temporarily in a local development environment when troubleshooting.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# A signing key must always be supplied by the deployment environment. Never
# ship a fallback key: anyone who knows it could forge authentication tokens.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
